name: Gerar instaladores

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run rebuild:desktop
      - run: npm run dist -- --win --config.npmRebuild=false
      - uses: actions/upload-artifact@v4
        with:
          name: Biblio-Windows
          path: dist/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run rebuild:desktop
      - run: npm run dist -- --linux --config.npmRebuild=false
      - uses: actions/upload-artifact@v4
        with:
          name: Biblio-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
