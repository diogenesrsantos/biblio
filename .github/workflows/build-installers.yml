name: Gerar instaladores

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run rebuild:desktop
      - name: Gerar instalador Windows
        shell: pwsh
        run: |
          npm run dist -- --win --config.npmRebuild=false --publish never 2>&1 | Tee-Object -FilePath build-windows.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build-windows.log -Tail 30 | ForEach-Object { Write-Output "::error::$($_ -replace '%','%25')" }
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Biblio-Windows
          path: dist/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run rebuild:desktop
      - name: Gerar instaladores Linux
        shell: bash
        run: |
          set -o pipefail
          npm run dist -- --linux --config.npmRebuild=false --publish never 2>&1 | tee build-linux.log || {
            status=$?
            tail -n 30 build-linux.log | sed 's/%/%25/g; s/^/::error::/'
            exit "$status"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Biblio-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
