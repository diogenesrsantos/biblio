name: Gerar instaladores

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run rebuild:desktop
      - name: Gerar instalador Windows
        shell: pwsh
        run: |
          $buildLog = Join-Path $env:RUNNER_TEMP 'biblio-build-windows.log'
          npm run dist -- --win --config.npmRebuild=false --publish never 2>&1 | Tee-Object -FilePath $buildLog
          if ($LASTEXITCODE -ne 0) {
            Get-Content $buildLog -Tail 30 | ForEach-Object { Write-Output "::error::$($_ -replace '%','%25')" }
            exit 1
          }
          node -e "const asar=require('@electron/asar'); JSON.parse(asar.extractFile('dist/win-unpacked/resources/app.asar','package.json').toString()); console.log('app.asar do Windows validado')"
      - uses: actions/upload-artifact@v4
        with:
          name: Biblio-Windows
          path: dist/*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run rebuild:desktop
      - name: Gerar instaladores Linux
        shell: bash
        run: |
          set -o pipefail
          build_log="$RUNNER_TEMP/biblio-build-linux.log"
          npm run dist -- --linux --config.npmRebuild=false --publish never 2>&1 | tee "$build_log" || {
            status=$?
            tail -n 30 "$build_log" | sed 's/%/%25/g; s/^/::error::/'
            exit "$status"
          }
          node -e "const asar=require('@electron/asar'); JSON.parse(asar.extractFile('dist/linux-unpacked/resources/app.asar','package.json').toString()); console.log('app.asar do Linux validado')"
      - uses: actions/upload-artifact@v4
        with:
          name: Biblio-Linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: release
          merge-multiple: true
      - name: Publicar instaladores na versão
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "Biblio $GITHUB_REF_NAME" \
            --notes "Instaladores da Biblio para Windows e Linux. Faça um backup da biblioteca antes de restaurar ou atualizar uma instalação existente."
